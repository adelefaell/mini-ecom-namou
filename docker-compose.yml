services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=file:./data/mini-ecom.db
    volumes:
      - mini-ecom-data:/app/apps/backend/data

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - API_TARGET=http://backend:3001
    depends_on:
      - backend

volumes:
  mini-ecom-data:
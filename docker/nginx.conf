server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # API traffic -> backend service (Fastify on 3001). Keeps the browser on
    # the same origin (/api/*), so the httpOnly session cookie and CORS work
    # without any cross-origin setup.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: serve static assets, fall back to index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}